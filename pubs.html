          year: "2026",
          type: "Conference paper",
          title: "A Nightly Feedback-Driven Strategy for Quality Control in Safety-Critical Software Development",
          authors: "Simin Sun, Peter Nemeth, Staffan Johansson, Theo Wiik, David Friberg, Farnaz Fotrousi, Miroslaw Staron",
          venue: "20th International Symposium on Empirical Software Engineering and Measurement (ESEM 2026)",
          note: "LIPIcs Volume 394, Article 81, Pages 81:1-81:20",
          link: "https://doi.org/10.4230/LIPIcs.ESEM.2026.81",
          summary:
            "This paper studies how to run costly quality analyses such as static analysis without slowing continuous integration, through action research at an organization developing safety-critical autonomous-driving software. It finds that nightly analysis runs combined with a feedback mechanism kept selected quality issues under control, reduced late clean-up and improved teams' follow-up responsibility and efficiency."
        },
        {
          year: "2026",
          type: "Preprint",
          title: "Developing a Roadmap to an AI-first Organization: A Case Study in Embedded Software Development",
          authors: "Viktor Kjellberg, Srijita Basu, Simin Sun, Farnaz Fotrousi, Miroslaw Staron",
          venue: "arXiv",
          note: "arXiv:2609.30863",
          link: "https://arxiv.org/abs/2609.30863",
          summary:
            "This paper studies how a large embedded systems company can move toward becoming an AI-first organization built around increasingly autonomous AI agents, based on a workshop with 40 practitioners. It finds participants expect agents to reshape team structures, skills, strategy and developer roles, and proposes a roadmap covering federated AI teams and human oversight."
        }
      ];

      const slidesRoot = document.getElementById("slides");
      const years = [...new Set(publications.map((item) => item.year))];

      years.forEach((year) => {
        const items = publications.filter((item) => item.year === year);
        const overview = document.createElement("section");
        overview.className = "year-overview";
        overview.innerHTML = `
          <p class="eyebrow">Year ${year}</p>
          <h2>${items.length} publications</h2>
          <p class="lead">
            Move right to browse each publication, then down for details inside
            every publication set.
          </p>
        `;
        slidesRoot.appendChild(overview);

        items.forEach((item, index) => {
          const group = document.createElement("section");
          group.innerHTML = `
            <section class="publication-slide">
              <p class="eyebrow">${item.year} | ${item.type}</p>
              <h2>${item.title}</h2>
              <p class="meta-line">${item.venue}</p>
              <p class="meta-line">${item.authors}</p>
              <p class="publication-count">${index + 1} of ${items.length} in ${year}</p>
            </section>
            <section class="detail-slide">
              <p class="eyebrow">Reference Details</p>
              <div class="detail-grid">
                <div class="detail-card">
                  <span class="detail-label">Title</span>
                  <p>${item.title}</p>
                </div>
                <div class="detail-card">
                  <span class="detail-label">Authors</span>
                  <p>${item.authors}</p>
                </div>
                <div class="detail-card">
                  <span class="detail-label">Venue</span>
                  <p>${item.venue}</p>
                </div>
                <div class="detail-card">
                  <span class="detail-label">Notes</span>
                  <p>${item.note}</p>
                </div>
              </div>
            </section>
            <section class="summary-slide">
              <p class="eyebrow">Link and Summary</p>
              <p class="summary-copy">${item.summary}</p>
              <p class="link-line">
                <a href="${item.link}" target="_blank" rel="noreferrer">Open publication page</a>
              </p>
            </section>
          `;
          slidesRoot.appendChild(group);
        });
      });

      const deck = new Reveal({
        controls: true,
        progress: true,
        hash: true,
        center: true,
        transition: "slide",
        navigationMode: "default"
      });

      deck.initialize();
    </script>
  </body>
